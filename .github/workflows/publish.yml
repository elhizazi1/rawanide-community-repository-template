name: Build and publish community repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-repository-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build repository and packages
        run: node tools/build.mjs
      - name: Commit generated files
        shell: bash
        run: |
          # Stage only generated files that exist, including optional extension output.
          git add -A -- repository.json index.html about
          if [[ -d extensions ]]; then
            git add -A -- extensions
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: publish community repository [skip ci]'
            git push
          else
            echo 'No generated changes to publish.'
          fi
