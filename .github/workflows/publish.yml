name: Build and publish community repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-repository-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository variable; default keeps SDK installation unnecessary.
      RAWANIDE_SDK_VALIDATE: ${{ vars.RAWANIDE_SDK_VALIDATE || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK 1.1.0 for optional validation
        if: env.RAWANIDE_SDK_VALIDATE == '1'
        run: npm install --global @elhizazi1/extension-sdk@1.1.0
      - name: Test repository tooling
        shell: bash
        run: |
          if [[ "$RAWANIDE_SDK_VALIDATE" == '1' ]]; then
            export RAWANIDE_TEST_SDK_COMMAND=rawanide-sdk
          fi
          node --test tools/tests/*.test.mjs
      - name: Build repository and packages
        run: node tools/build.mjs
      - name: Verify catalog and archives
        run: node tools/tests/verify-build.mjs
      - name: Commit generated files
        shell: bash
        run: |
          git add -A -- repo.config.json repository.json index.html about
          if [[ -d extensions ]]; then
            git add -A -- extensions
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: publish community repository [skip ci]'
            git push
          else
            echo 'No generated changes to publish.'
          fi
      - name: Report GitHub Pages activation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          settings_url="https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          repo_name="${GITHUB_REPOSITORY#*/}"
          site_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo_name}/"
          response="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 15 --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")" || status='000'
          {
            echo '## RawanIDE Community Repository — publishing status'
            echo ''
            echo "- Repository JSON: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/repository.json"
            echo "- Expected website: ${site_url}"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == '200' ]]; then
            echo 'GitHub Pages is enabled. This does not guarantee that deployment has finished or that the site is already reachable.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=GitHub Pages setup required or unverified::GitHub Pages could not be confirmed (HTTP ${status}). The generated website may show 404. Open ${settings_url} and choose Deploy from a branch > main > /(root) > Save."
            {
              echo '### ⚠️ GitHub Pages activation needs attention'
              echo ''
              echo "Pages activation could not be confirmed (API HTTP ${status}). This does not mean the repository build failed."
              echo ''
              echo "If the website displays **404**, open [Settings → Pages](${settings_url}) and select **Deploy from a branch**, **main**, **/(root)**, then **Save**. Wait for the Pages deployment to finish."
              echo ''
              echo 'The workflow cannot bypass GitHub repository permissions or Pages settings.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$response"
