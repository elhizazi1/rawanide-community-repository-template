name: Build and publish community repository
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-repository-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository owner and branch
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('repo.config.json')); const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/'); if(c.owner!==owner||c.repo!==repo||c.branch!==process.env.GITHUB_REF_NAME) throw Error('Update repo.config.json owner/repo/branch to match this repository before publishing');"
      - name: Build repository and packages
        run: node tools/build.mjs
      - name: Commit generated files
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- repository.json index.html about extensions)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add repository.json index.html about extensions
            git commit -m 'chore: publish community repository [skip ci]'
            git push
          fi
