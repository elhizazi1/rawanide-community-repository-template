name: Build and publish community repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: community-repository-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build repository and packages
        run: node tools/build.mjs
      - name: Commit generated files
        shell: bash
        run: |
          git add -A -- repository.json index.html about
          if [[ -d extensions ]]; then
            git add -A -- extensions
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: publish community repository [skip ci]'
            git push
          else
            echo 'No generated changes to publish.'
          fi
      - name: Check and attempt first-time GitHub Pages setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${GH_TOKEN}")
          response="$(mktemp)"
          status="$(curl -sS -o "$response" -w '%{http_code}' "${headers[@]}" "$api")"
          if [[ "$status" == '404' ]]; then
            # Try to enable Pages using the same branch/root mode verified by the template author.
            status="$(curl -sS -o "$response" -w '%{http_code}' -X POST "${headers[@]}" \
              -H 'Content-Type: application/json' \
              -d '{"source":{"branch":"main","path":"/"}}' "$api")"
          fi
          {
            echo '## RawanIDE community repository publishing'
            echo "- Repository JSON: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/repository.json"
            echo "- Expected website: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == '200' || "$status" == '201' ]]; then
            echo '- GitHub Pages: configured. Deployment may take a few minutes.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Pages is not enabled (API status $status). Open Settings > Pages and select Deploy from a branch, main, /(root)."
            {
              echo "- GitHub Pages: automatic setup unavailable (API HTTP $status)."
              echo "- **One-time setup:** [Settings → Pages](https://github.com/${GITHUB_REPOSITORY}/settings/pages) → Deploy from a branch → main → /(root) → Save."
              echo '- This is a GitHub permission/Pages configuration requirement, not an extension build failure.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$response"
