<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RawanIDE Community Repository</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./assets/site.css"><style>body{margin:0;min-height:100vh} .starter{max-width:900px;margin:7vh auto;padding:24px} .starter article{border:1px solid #c7a66b;border-radius:24px;padding:clamp(22px,5vw,54px);background:rgba(20,32,52,.08)}.starter h1{font-size:clamp(2rem,5vw,3.5rem)}.starter p{line-height:1.9}.starter a{color:inherit;text-decoration:underline} .starter code{font-family:monospace}</style></head><body><main class="starter"><article><p>✦ RawanIDE · Community</p><h1 id="repo-name">Community Repository</h1><p id="repo-description">Extensions for RawanIDE.</p><p id="repo-status">No extensions published yet.</p><p><a id="repo-link" href="https://github.com/elhizazi1/RawanIDE">Repository source</a> · <a href="https://github.com/elhizazi1/rawanide-extension-sdk">Extension SDK</a> · <a href="https://rawanide.elhizazi.me/repositories">Marketplace</a></p><section id="extensions"></section></article></main><!--DATA--><script type="application/json" id="data">{"repository":{"protocol":"1.0","id":"community.example.repository","name":"My RawanIDE Repository","publisher":"Your Publisher Name","description":"My RawanIDE extensions.","homepageUrl":"https://elhizazi1.github.io/rawanide-community-repository-template/","repositoryUrl":"https://github.com/elhizazi1/rawanide-community-repository-template","icon":"https://raw.githubusercontent.com/elhizazi1/rawanide-community-repository-template/main/icon.svg","i18n":{"ar":{"name":"مستودع إضافاتي","description":"إضافاتي لتطبيق روان IDE."},"en":{"name":"My RawanIDE Repository","description":"My extensions for RawanIDE."}},"extensions":[]}}</script><!--/DATA--><script>try{const r=JSON.parse(document.getElementById('data').textContent).repository;if(r){document.title=r.name;document.getElementById('repo-name').textContent=r.name;document.getElementById('repo-description').textContent=r.description;document.getElementById('repo-link').href=r.repositoryUrl;const items=r.extensions||[];document.getElementById('repo-status').textContent=items.length?items.length+' published version(s)':'No extensions published yet.';const box=document.getElementById('extensions');for(const x of items){const p=document.createElement('p');const a=document.createElement('a');a.href=x.downloadUrl;a.textContent=x.name+' · '+x.version;p.appendChild(a);box.appendChild(p)}}}catch(e){console.error(e)}</script></body></html>
